<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Ceci n'est pas une page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: #ffeea6; color: #2b2515;
      font-family: Georgia, "Times New Roman", serif; padding: 2rem;
    }
    .code {
      font-size: clamp(7rem, 28vw, 16rem); font-weight: 700; line-height: 0.9;
      letter-spacing: -0.04em;
    }
    .code span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
    .code span:nth-child(2) { animation-delay: 0.2s; color: #fffbea; -webkit-text-stroke: 3px #2b2515; }
    .code span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bob { 50% { transform: translateY(-14px); } }
    h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 400; font-style: italic; margin-top: 1.2rem; }
    p { margin-top: 0.8rem; font-family: system-ui, sans-serif; color: #6a5f43; }
    a {
      display: inline-block; margin-top: 2rem; padding: 0.8rem 1.6rem; border-radius: 6px;
      background: #2b2515; color: #ffeea6; text-decoration: none;
      font-family: system-ui, sans-serif; font-weight: 600;
    }
    a:hover { background: #000; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1>Ceci n'est pas une page</h1>
    <p>This is not a page, because the page you asked for does not exist.</p>
    <a href="/">Back to the home page</a>
  </main>
</body>
</html>
